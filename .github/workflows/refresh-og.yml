name: refresh-og

on:
  workflow_dispatch:
  push:
    branches: [seo-phase-b-metadata-20260922]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-b-metadata-20260922
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install pinned tooling
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate deterministic social card
        run: node tools/og.mjs
      - name: Validate asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path("assets/og.png")
          b=p.read_bytes()
          assert b[:8]==b"\x89PNG\r\n\x1a\n"
          w,h=struct.unpack(">II",b[16:24])
          assert (w,h)==(1200,630), (w,h)
          assert len(b) > 10000
          print("dimensions",w,h)
          print("bytes",len(b))
          print("sha256",hashlib.sha256(b).hexdigest())
          PY
      - name: Commit refreshed asset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/og.png; then
            echo "OG asset already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og.png
          git commit -m "seo: refresh canonical social card"
          git push origin HEAD:seo-phase-b-metadata-20260922
