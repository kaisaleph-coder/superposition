name: phase-c-edge

on:
  workflow_dispatch:
  push:
    branches: [seo-phase-c-remediation-20260922]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Wait for Cloudflare candidate preview
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://seo-phase-c-remediation-20260922-superposition-rc1-staging.kais-aleph.workers.dev"
          ready=0
          for i in $(seq 1 40); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/home.html -D /tmp/home.headers -w '%{http_code}' "$BASE/" || true)"
            if [[ "$code" == "200" ]] && grep -q "Kais Abu-Hussein | Multidisciplinary Executive" /tmp/home.html; then
              ready=1
              break
            fi
            sleep 3
          done
          [[ "$ready" == "1" ]] || { echo "Candidate preview never became ready"; exit 1; }

      - name: Verify preview security and indexability headers
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://seo-phase-c-remediation-20260922-superposition-rc1-staging.kais-aleph.workers.dev"
          for path in / /resume/ /seo-phase-c-definitely-missing; do
            key="$(printf '%s' "$path" | tr '/.' '__' | sed 's/^_*//')"
            [[ -n "$key" ]] || key=root
            code="$(curl -sS --connect-timeout 5 --max-time 20 -o "/tmp/${key}.body" -D "/tmp/${key}.headers" -w '%{http_code}' "$BASE$path")"
            if [[ "$path" == "/seo-phase-c-definitely-missing" ]]; then [[ "$code" == "404" ]]; else [[ "$code" == "200" ]]; fi
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex([[:space:]]|$)' "/tmp/${key}.headers"
            grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "/tmp/${key}.headers"
            grep -Eiq '^x-frame-options:[[:space:]]*DENY' "/tmp/${key}.headers"
            grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "/tmp/${key}.headers"
            grep -Eiq '^permissions-policy:' "/tmp/${key}.headers"
            grep -Eiq "^content-security-policy:.*script-src 'self'.*script-src-attr 'none'.*frame-ancestors 'none'" "/tmp/${key}.headers"
          done
          echo "security_headers=PASS"

      - name: Install browser audit tooling
        run: |
          npm install --no-fund --no-audit
          npm install --no-save lighthouse@latest
          npx playwright install --with-deps chromium

      - name: Verify CSP, focus, fallback and runtime errors
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { chromium, devices } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          const BASE='https://seo-phase-c-remediation-20260922-superposition-rc1-staging.kais-aleph.workers.dev';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({...devices['Desktop Chrome']});
          const page=await ctx.newPage();

          const consoleErrors=[],pageErrors=[],failed=[],csp=[];
          page.on('console',m=>{
            if(m.type()==='error') consoleErrors.push(m.text());
            if(/content security policy|refused to/i.test(m.text())) csp.push(m.text());
          });
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()}));

          await page.goto(BASE+'/',{waitUntil:'networkidle'});
          await page.waitForTimeout(3000);

          const runtime=await page.evaluate(()=>({
            tier:document.body.dataset.tier,
            renderer:document.body.dataset.renderer,
            fallback:document.body.dataset.performanceFallback||null,
            mainChars:document.querySelector('main')?.textContent?.replace(/\s+/g,' ').trim().length||0,
            importMaps:document.querySelectorAll('script[type="importmap"]').length,
            headScript:document.querySelectorAll('script[src="/js/head.js"]').length
          }));
          if(runtime.tier!=='0'||runtime.renderer!=='static') throw new Error('software/headless path did not reach static fallback: '+JSON.stringify(runtime));
          if(runtime.importMaps!==0||runtime.headScript!==1) throw new Error('CSP-ready bootstrap mismatch: '+JSON.stringify(runtime));

          const axeHome=await new AxeBuilder({page}).analyze();
          const badAxe=axeHome.violations.filter(v=>['critical','serious','moderate'].includes(v.impact));
          if(badAxe.length) throw new Error('axe violations: '+badAxe.map(v=>v.id).join(','));

          const index=page.locator('[data-ui="index"]');
          await index.focus(); await index.click();
          await page.locator('[data-ui-close="index"]').click();
          if(!(await index.evaluate(el=>el===document.activeElement))) throw new Error('Index focus not restored');

          const system=page.locator('[data-ui="system"]');
          await system.focus(); await system.click();
          await page.keyboard.press('Escape');
          if(!(await system.evaluate(el=>el===document.activeElement))) throw new Error('System focus not restored');

          await page.goto(BASE+'/resume/',{waitUntil:'networkidle'});
          const axeResume=await new AxeBuilder({page}).analyze();
          const badResume=axeResume.violations.filter(v=>['critical','serious','moderate'].includes(v.impact));
          if(badResume.length) throw new Error('resume axe violations: '+badResume.map(v=>v.id).join(','));

          if(csp.length) throw new Error('CSP violations: '+JSON.stringify(csp));
          if(consoleErrors.length) throw new Error('console errors: '+JSON.stringify(consoleErrors));
          if(pageErrors.length) throw new Error('page errors: '+JSON.stringify(pageErrors));
          if(failed.length) throw new Error('failed requests: '+JSON.stringify(failed));

          console.log('PHASE_C_BROWSER '+JSON.stringify({runtime,axeHome:badAxe.length,axeResume:badResume.length,cspViolations:csp.length,consoleErrors:consoleErrors.length,pageErrors:pageErrors.length,failedRequests:failed.length}));
          await browser.close();
          NODE

      - name: Lighthouse candidate performance and accessibility
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://seo-phase-c-remediation-20260922-superposition-rc1-staging.kais-aleph.workers.dev/"
          npx lighthouse "$BASE" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lh-mobile.json
          npx lighthouse "$BASE" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lh-desktop.json
          node - <<'NODE'
          const fs=require('fs');
          for(const mode of ['mobile','desktop']){
            const j=JSON.parse(fs.readFileSync('/tmp/lh-'+mode+'.json','utf8'));
            const a=j.audits,c=j.categories,v=id=>a[id]?.numericValue??null;
            const out={
              mode,
              performance:Math.round((c.performance?.score??0)*100),
              accessibility:Math.round((c.accessibility?.score??0)*100),
              bestPractices:Math.round((c['best-practices']?.score??0)*100),
              seo:Math.round((c.seo?.score??0)*100),
              FCP_ms:v('first-contentful-paint'),
              LCP_ms:v('largest-contentful-paint'),
              CLS:v('cumulative-layout-shift'),
              TBT_ms:v('total-blocking-time'),
              speedIndex_ms:v('speed-index'),
              interactive_ms:v('interactive')
            };
            console.log('PHASE_C_LIGHTHOUSE_PREVIEW '+JSON.stringify(out));
            if(out.LCP_ms>2500) throw new Error(mode+' LCP gate failed: '+out.LCP_ms);
            if(out.CLS>=0.1) throw new Error(mode+' CLS gate failed: '+out.CLS);
            if(out.accessibility<100||out.bestPractices<100) throw new Error(mode+' category regression');
          }
          NODE

      - name: Lighthouse exact-candidate SEO gate
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8090 >/tmp/seo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8090/ >/dev/null && break
            sleep 0.25
          done
          npx lighthouse http://127.0.0.1:8090/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --only-categories=seo --output=json --output-path=/tmp/lh-seo.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/lh-seo.json','utf8'));
          const seo=Math.round((j.categories.seo?.score??0)*100);
          console.log('PHASE_C_LIGHTHOUSE_SEO '+JSON.stringify({seo}));
          if(seo!==100) throw new Error('SEO category regression: '+seo);
          NODE
