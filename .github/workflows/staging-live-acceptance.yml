name: staging-live-acceptance

on:
  pull_request:
    types: [synchronize]
    branches: [cloudflare-staging-anchor]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  accept:
    if: github.head_ref == 'rc1-cloudflare-preview-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out acceptance harness from anchor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install browser and software GPU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Wait for Cloudflare PR preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          COMMIT_AT="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')"
          export COMMIT_AT
          for i in $(seq 1 72); do
            COMMENTS="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")"
            URL="$(printf '%s' "$COMMENTS" | python -c '
          import json,os,re,sys
          from datetime import datetime,timezone,timedelta
          comments=json.load(sys.stdin)
          commit=datetime.fromisoformat(os.environ["COMMIT_AT"].replace("Z","+00:00"))-timedelta(seconds=30)
          urls=[]
          for c in comments:
              when=datetime.fromisoformat(c["updated_at"].replace("Z","+00:00"))
              if when < commit: continue
              if c.get("user",{}).get("type") != "Bot": continue
              urls += re.findall(r"https://[A-Za-z0-9.-]+\.workers\.dev", c.get("body") or "")
          print(urls[-1] if urls else "")
          ')"
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Cloudflare preview detected: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No fresh Cloudflare workers.dev preview URL appeared on PR #$PR_NUMBER"
          exit 1

      - name: Run exact-origin live staging acceptance
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: xvfb-run -a -s "-screen 0 1440x900x24" node tools/staging-live-acceptance.mjs

      - name: Upload staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superposition-staging-live-acceptance
          path: staging-live/
          if-no-files-found: warn

      - name: Comment acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            BODY="SUPERPOSITION staging acceptance: **PASS**\n\nPreview: $PREVIEW_URL\nEvidence: $RUN_URL\n\nDo not merge this staging-only PR."
          else
            BODY="SUPERPOSITION staging acceptance: **FAIL**\n\nPreview: ${PREVIEW_URL:-not detected}\nEvidence: $RUN_URL\n\nDo not merge this staging-only PR."
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
