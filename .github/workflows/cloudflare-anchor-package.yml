name: cloudflare-anchor-package

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-staging-anchor]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install pinned staging tooling
        run: npm install --no-fund --no-audit

      - name: Confirm anchor isolation
        run: |
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            if(c.workers_dev !== false) throw new Error('workers_dev must remain false');
            if(c.preview_urls !== false) throw new Error('anchor preview_urls must remain false');
            if(c.route || c.routes) throw new Error('anchor must not bind any route');
            if(c.name !== 'superposition-rc1-staging') throw new Error('unexpected Worker name');
            if(c.assets?.directory !== './.staging-dist') throw new Error('unexpected anchor asset directory');
            console.log('anchor isolation ok');
          "

      - name: Prepare inert anchor payload
        run: npm run stage:prepare

      - name: Validate live-acceptance harness syntax
        run: node --check tools/staging-live-acceptance.mjs

      - name: Cloudflare anchor dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/superposition-cf-anchor-dry-run
