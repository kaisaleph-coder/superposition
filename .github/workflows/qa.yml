# SUPERPOSITION QA — source, budget, semantic/browser and accessibility gates.
name: qa
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Budget gate
        run: node tools/budget.mjs
      - name: Multi-surface source contract
        run: node tools/surface-scene-contract.mjs > /tmp/surface-contract.json
      - name: Bake parity gate
        run: |
          node tools/bake.mjs
          git diff --exit-code -- index.html
      - name: Install dev tooling
        run: npm install --no-fund --no-audit
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Static runtime smoke
        run: |
          python -m http.server 8080 &
          sleep 2
          node tools/static-smoke.mjs

      - name: Edge worker unit tests
        run: node --test tests/worker-edge.test.mjs
      - name: QA (content, state, print, a11y, S4 integration)
        run: npx playwright test --config tests/playwright.config.js content.spec.js state.spec.js print.spec.js a11y.spec.js s4-integration.spec.js seo-p0.spec.js metadata-schema.spec.js browser-runtime-evidence.spec.js --ignore-snapshots
      - name: Dead-link check
        run: |
          node -e "
            const urls=['/','/resume/','/404.html','/robots.txt','/sitemap.xml'];
            for (const u of urls) {
              const r = await fetch('http://localhost:8080'+u);
              if (!r.ok) { console.error(u, r.status); process.exit(1); }
            }
            console.log('links ok');
          "
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-evidence-${{ github.sha }}
          path: |
            test-results/**/runtime-*.png
            test-results/**/runtime-evidence-*.json
          if-no-files-found: warn
          retention-days: 14
